[project]
name = "ekvachan"
version = "0.1.0"
description = "ekVachan: an open, self-hostable System One decision model"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "transformers>=4.45",
    "datasets>=3.0",
    "accelerate>=1.0",
    "peft>=0.13",
    # Vision tier (PRD 5.2b): transformers 5.x makes torchvision a hard dependency of any
    # image processor -- AutoImageProcessor/AutoProcessor raise ImportError without it.
    "pillow>=10.0",
    "torchvision>=0.19",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "huggingface-hub>=0.25",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # ViZDoom episodic benchmark (PRD 8.1/8.1d): installs from a prebuilt manylinux wheel under
    # this repo's own (>=3.11) uv-managed Python -- the system python3 on the training server is
    # 3.6.15 and silently falls back to a broken CMake source build if used instead (verified
    # 2026-09-24, see PRD.md 8.1d Finding 1). MIT license, bundles GPL-descended ZDoom + BSD
    # Freedoom assets -- consumed as an ordinary dependency, never forked (PRD.md 7.4).
    "vizdoom>=1.3.1",
]

[tool.uv]
python-preference = "managed"
