[project]
name = "ekvachan-client"
version = "0.1.0"
description = "Minimal Python client for ekVachan's /v1/systemone endpoint"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["fastapi>=0.115", "uvicorn>=0.30", "pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ekvachan_client"]
